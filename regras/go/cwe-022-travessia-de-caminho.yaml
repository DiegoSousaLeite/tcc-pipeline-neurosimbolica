# CWE-22 — Improper Limitation of a Pathname to a Restricted Directory
#
# PROTOCOLO: `definicao`. Escrita a partir da definição da CWE-22 (MITRE) e do
# idioma de Go, sem que nenhum arquivo da população tenha sido inspecionado.
# Fontes consultadas:
#   - CWE-22, MITRE: "the software uses external input to construct a pathname
#     that is intended to identify a file or directory that is located
#     underneath a restricted parent directory, but the software does not
#     properly neutralize special elements within the pathname".
#   - documentação de `os` (Open, OpenFile, ReadFile, Create), `path/filepath`
#     (Join, Clean) e `net/http` (ServeFile, Request.FormValue, URL.Query).
#
# Por que sintática, e não `mode: taint` (design.md, D5): o motor CE só rastreia
# fluxo dentro de um arquivo, e é essa limitação que deixou CWE-22 seca. Regra
# de taint rodando sob o motor que não a alcança repetiria o defeito que esta
# change tenta corrigir. O custo é ruído — que é precisamente o que o braço
# neural existe para filtrar.
rules:
  - id: caminho-de-entrada-externa-sem-restricao
    languages: [go]
    severity: WARNING
    message: >-
      Caminho construído a partir de entrada externa chega a uma API de sistema
      de arquivos. Sem restrição a um diretório permitido, `../` na entrada
      escapa do diretório pretendido (CWE-22). `filepath.Join` limpa o caminho
      resultante, mas não impede que ele saia da base.
    metadata:
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      subcategory: [vuln]
      proveniencia: definicao
      confidence: LOW
      category: security
      technology: [go]
      references:
        - https://cwe.mitre.org/data/definitions/22.html
        - https://pkg.go.dev/path/filepath#Join
    patterns:
      # O destino: uma API que abre, lê, cria ou serve arquivo, recebendo um
      # caminho em que a variável de entrada aparece em qualquer profundidade.
      - pattern-either:
          - pattern: os.Open(<... $EXTERNO ...>)
          - pattern: os.OpenFile(<... $EXTERNO ...>, ...)
          - pattern: os.ReadFile(<... $EXTERNO ...>)
          - pattern: os.Create(<... $EXTERNO ...>)
          - pattern: os.Remove(<... $EXTERNO ...>)
          - pattern: ioutil.ReadFile(<... $EXTERNO ...>)
          - pattern: ioutil.WriteFile(<... $EXTERNO ...>, ...)
          - pattern: http.ServeFile($W, $R, <... $EXTERNO ...>)
      # A origem: a variável vem de um acessor de dado de requisição, no mesmo
      # escopo. É o que separa "caminho composto" — que todo programa faz — de
      # "caminho composto com o que o cliente mandou".
      - pattern-inside: |
          $EXTERNO := $FONTE
          ...
      - metavariable-pattern:
          metavariable: $FONTE
          patterns:
            - pattern-either:
                - pattern: <... $R.URL.Query().Get(...) ...>
                - pattern: <... $R.URL.Path ...>
                - pattern: <... $R.FormValue(...) ...>
                - pattern: <... $R.PostFormValue(...) ...>
                - pattern: <... $R.Header.Get(...) ...>
                - pattern: <... mux.Vars($R)[...] ...>
                - pattern: <... chi.URLParam(...) ...>
                - pattern: <... $C.Param(...) ...>
                - pattern: <... $C.Query(...) ...>
                - pattern: <... $C.FormValue(...) ...>
